<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'nonce-founder-preview' https://esm.sh; style-src 'unsafe-inline'; img-src data: blob:; connect-src https://ezwxcvpcrnsqajixwkvq.supabase.co; base-uri 'none'; form-action 'none'">
  <title>Executive Dialectic™ · Founder identity preview</title>
  <style>
    body { margin: 0; background: #faf7f1; color: #242622; font: 18px Georgia, serif; }
    main { max-width: 38rem; margin: 10vh auto; padding: 2rem; }
    header { color: #745b31; letter-spacing: .12em; padding-bottom: 1rem; border-bottom: 1px solid #bca779; }
    h1 { font-weight: 400; }
    input, button { display: block; box-sizing: border-box; padding: .8rem; margin: .5rem 0 1rem; font: inherit; }
    input { width: 100%; max-width: 25rem; }
    button { background: transparent; border: 1px solid #745b31; min-height: 44px; }
    #setup-qr { display: block; width: min(100%, 260px); height: auto; background: white; padding: 12px; }
    #setup-qr[hidden] { display: none; }
    button:enabled { cursor: pointer; }
  </style>
</head>
<body>
  <main>
    <header>EXECUTIVE DIALECTIC™</header>
    <h1>Founder identity preview</h1>
    <form id="sign-in">
      <label for="email">Founder email</label>
      <input id="email" type="email" autocomplete="email" required>
      <button disabled>Send secure sign-in link</button>
    </form>
    <section id="mfa" hidden>
      <button id="enroll" type="button">Set up authenticator</button>
      <form id="verify" hidden>
        <div id="setup" hidden>
          <p>Open your authenticator and choose Scan a QR code. Keep this screen private.</p>
          <img id="setup-qr" width="260" height="260" alt="Authenticator setup QR code">
          <details>
            <summary>Enter setup key manually</summary>
            <p id="key-help"></p>
            <code id="key"></code>
          </details>
        </div>
        <label for="otp">Six-digit authenticator code</label>
        <input id="otp" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" required>
        <button>Verify authenticator</button>
      </form>
    </section>
    <p id="status" role="status">Loading sign-in preview…</p>
  </main>
  <script type="module" nonce="founder-preview">
    const form = document.querySelector('#sign-in');
    const emailInput = document.querySelector('#email');
    const button = form.querySelector('button');
    const status = document.querySelector('#status');
    const callback = new URL(location.pathname, location.origin);
    const query = new URLSearchParams(location.search);
    const fragment = new URLSearchParams(location.hash.slice(1));
    const code = query.get('code');
    const authError = query.has('error') || fragment.has('error') || fragment.has('access_token');
    if (location.search || location.hash) history.replaceState(null, '', callback.pathname);

    async function prepareMfa(client) {
      const section = document.querySelector('#mfa');
      const enroll = document.querySelector('#enroll');
      const verify = document.querySelector('#verify');
      const verifyButton = verify.querySelector('button');
      const otp = document.querySelector('#otp');
      const setup = document.querySelector('#setup');
      const key = document.querySelector('#key');
      const keyHelp = document.querySelector('#key-help');
      const qr = document.querySelector('#setup-qr');
      let qrObjectUrl;
      const { data: factors, error } = await client.auth.mfa.listFactors();
      if (error) throw error;
      let factorId = factors.totp[0]?.id;

      section.hidden = false;
      enroll.hidden = Boolean(factorId);
      verify.hidden = !factorId;
      status.textContent = 'Founder account confirmed. Verify your authenticator to continue.';

      enroll.addEventListener('click', async () => {
        enroll.disabled = true;
        try {
          const { data, error } = await client.auth.mfa.enroll({
            factorType: 'totp', issuer: 'Executive Dialectic',
          });
          if (error) throw error;
          factorId = data.id;
          const { qr_code: qrCode, secret } = data.totp;
          if (qrCode.startsWith('data:image/svg+xml')) {
            qr.src = qrCode;
          } else {
            qrObjectUrl = URL.createObjectURL(new Blob([qrCode], { type: 'image/svg+xml' }));
            qr.src = qrObjectUrl;
          }
          const manualKey = secret.trim();
          const canEnterManually = /^[A-Z2-7]+={0,6}$/.test(manualKey);
          key.textContent = canEnterManually ? manualKey : '';
          keyHelp.textContent = canEnterManually
            ? 'Copy this key directly into your authenticator and select Time based.'
            : 'Use the QR code to add this account.';
          setup.hidden = false;
          enroll.hidden = true;
          verify.hidden = false;
          otp.focus();
        } catch {
          status.textContent = 'Authenticator setup could not start. Try again.';
          enroll.disabled = false;
        }
      });

      verify.addEventListener('submit', async event => {
        event.preventDefault();
        verifyButton.disabled = true;
        const code = otp.value;
        otp.value = '';
        try {
          const { error } = await client.auth.mfa.challengeAndVerify({ factorId, code });
          if (error) throw error;
          const { data, error: assuranceError } = await client.auth.mfa.getAuthenticatorAssuranceLevel();
          if (assuranceError || data.currentLevel !== 'aal2') {
            status.textContent = 'The session could not be confirmed at AAL2. Verify again.';
            return;
          }
          key.textContent = '';
          qr.removeAttribute('src');
          if (qrObjectUrl) URL.revokeObjectURL(qrObjectUrl);
          section.hidden = true;
          status.textContent = 'Founder account and authenticator verified. Session level: AAL2.';
        } catch {
          status.textContent = 'Authenticator verification failed. Try a fresh code.';
        } finally {
          verifyButton.disabled = false;
        }
      });
    }

    async function initialize() {
      const { createClient } = await import('https://esm.sh/@supabase/supabase-js@2.57.0?bundle');
      const memory = new Map();
      const storage = {
        // Keep only the PKCE verifier across tabs in the same browser profile.
        getItem: key => key.endsWith('-code-verifier') ? localStorage.getItem(key) : memory.get(key) ?? null,
        setItem: (key, value) => key.endsWith('-code-verifier') ? localStorage.setItem(key, value) : memory.set(key, value),
        removeItem: key => key.endsWith('-code-verifier') ? localStorage.removeItem(key) : memory.delete(key),
      };
      const client = createClient(
        'https://ezwxcvpcrnsqajixwkvq.supabase.co',
        'sb_publishable_otIc8zS_Ha4M_FdA9gvPmw_WNfzASt5',
        { auth: {
          flowType: 'pkce', storageKey: 'executive-dialectic-preview-v1', storage,
          persistSession: true, autoRefreshToken: false, detectSessionInUrl: false,
        } },
      );

      form.addEventListener('submit', async event => {
        event.preventDefault();
        button.disabled = true;
        status.textContent = 'Requesting sign-in link…';
        try {
          const { error } = await client.auth.signInWithOtp({
            email: emailInput.value.trim(),
            options: { emailRedirectTo: callback.href, shouldCreateUser: false },
          });
          if (error) throw error;
          status.textContent = 'Open the latest email link in this same browser profile.';
        } catch (error) {
          if (error?.code === 'over_email_send_rate_limit') {
            status.textContent = 'Supabase reached the email sending limit. Wait before requesting another link.';
          } else if (error?.status === 429) {
            status.textContent = 'Too many requests. Wait before trying again.';
          } else {
            status.textContent = 'The link could not be requested. Check the Auth logs for the cause.';
          }
        } finally {
          button.disabled = false;
        }
      });

      if (authError) {
        status.textContent = 'Sign-in was rejected. Request a new link.';
      } else if (code) {
        status.textContent = 'Verifying the sign-in with Supabase Auth…';
        const { error: exchangeError } = await client.auth.exchangeCodeForSession(code);
        if (exchangeError) {
          status.textContent = 'The link could not be exchanged. Request a fresh link in this browser.';
        } else {
          const { data, error } = await client.auth.getUser();
          if (!error && data.user?.email_confirmed_at &&
              data.user.id === '471d6599-16ac-40dd-bca5-06bcd52fec28') {
            form.hidden = true;
            await prepareMfa(client);
            return;
          }
          status.textContent = 'This session could not be matched to the confirmed founder account.';
        }
      } else {
        status.textContent = '';
      }
      button.disabled = false;
    }

    initialize().catch(() => {
      status.textContent = 'Sign-in preview could not load. Reload this page and try again.';
    });
  </script>
</body>
</html>
