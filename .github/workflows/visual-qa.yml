name: Cross-engine visual acceptance
on:
  push:
    branches: [feature/application-foundation-v01]
  pull_request:
permissions:
  contents: read
jobs:
  browser-qa:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Playwright test runner
        run: npm install --no-audit --no-fund
      - name: Static structural check
        run: python3 scripts/verify-static.py
      - name: Desktop and mobile browser rendering
        run: npx playwright test
      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executive-dialectic-browser-qa
          path: |
            artifacts/
            playwright-report/
            test-results/
          retention-days: 14
