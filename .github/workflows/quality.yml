name: Static application quality gate
on:
  push:
    branches: [feature/application-foundation-v01]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify static structure
        run: python scripts/verify-static.py
