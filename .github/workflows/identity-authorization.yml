name: Identity, authorization and JCE isolation gate
on:
  push:
    branches: [feature/identity-authorization-v01, feature/jce-membership-check]
  pull_request:
permissions:
  contents: read
jobs:
  identity-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/identity-authorization.test.mjs tests/auth-callback.test.mjs tests/supabase-auth-verifier.test.mjs
      - run: python3 scripts/verify-static.py

  constitutional-isolation:
    name: Disposable PostgreSQL 17 JCE tenant isolation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Verify pinned constitutional fixture hashes
        shell: bash
        run: |
          set -euo pipefail
          cd tests/jce-kernel-fixture
          sha256sum -c SHA256SUMS
      - name: Reproduce JCE and execute tenant-isolation behavior
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name jce-pg17             --env POSTGRES_HOST_AUTH_METHOD=trust             --volume "$GITHUB_WORKSPACE:/workspace:ro"             postgres:17
          for i in $(seq 1 40); do
            if docker exec -u postgres jce-pg17 pg_isready -q; then break; fi
            sleep 1
          done
          docker exec -u postgres jce-pg17 createdb --template=template0 jce_repro_identity
          docker exec -u postgres -w /workspace jce-pg17             psql -X -v ON_ERROR_STOP=1 -d jce_repro_identity -f tests/jce-kernel-fixture/bootstrap-local.sql
          for file in schema.sql atomic_append_v02.sql local_executor_security.sql; do
            docker exec -u postgres -w /workspace jce-pg17               psql -X -v ON_ERROR_STOP=1 -d jce_repro_identity -f "tests/jce-kernel-fixture/$file"
          done
          docker exec -u postgres -w /workspace jce-pg17             psql -X -v ON_ERROR_STOP=1 -d jce_repro_identity -f tests/jce-kernel-fixture/verify-behavior.sql
      - name: Audit membership lookup with simulated Auth claims
        if: ${{ hashFiles('tests/jce-membership-check.sql') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          docker exec -u postgres -w /workspace jce-pg17 psql -X -v ON_ERROR_STOP=1 -d jce_repro_identity \
            -c "CREATE FUNCTION auth.jwt() RETURNS jsonb LANGUAGE sql STABLE AS 'SELECT current_setting(''request.jwt.claims'', true)::jsonb'" \
            -f supabase/migrations/20261124140000_executive_dialectic_current_membership.sql \
            -f tests/jce-membership-check.sql
      - name: Remove disposable database
        if: always()
        run: docker rm -f jce-pg17 >/dev/null 2>&1 || true
