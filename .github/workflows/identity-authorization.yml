name: Identity and authorization unit security gate
on:
  push:
    branches: [feature/identity-authorization-v01]
  pull_request:
permissions:
  contents: read
jobs:
  identity-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/identity-authorization.test.mjs
      - run: python3 scripts/verify-static.py
